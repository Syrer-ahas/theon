<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>503 — Tactical Web Is Under Development</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --violet: #a855f7;
        --violet-light: #d8b4fe;
        --ink: #11091d;
        --text: #f8f5ff;
        --muted: #c8b9dc;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; min-height: 100%; margin: 0; }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 52% 34%, rgba(168, 85, 247, .28), transparent 30%),
          radial-gradient(circle at 12% 88%, rgba(124, 58, 237, .2), transparent 34%),
          linear-gradient(145deg, #241139 0%, #160b26 46%, #0e0718 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .22;
        background-image:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at center, #000 18%, transparent 72%);
      }

      .orb {
        position: fixed;
        width: min(580px, 80vw);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(216, 180, 254, .12);
        box-shadow: inset 0 0 90px rgba(168, 85, 247, .07), 0 0 100px rgba(124, 58, 237, .08);
        animation: breathe 5s ease-in-out infinite;
      }

      .maintenance {
        position: relative;
        z-index: 1;
        width: min(700px, 100%);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 50px;
        color: #fff;
        font-weight: 800;
        letter-spacing: .01em;
      }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(168, 85, 247, .38);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 13px;
        margin-bottom: 22px;
        border: 1px solid rgba(216, 180, 254, .22);
        border-radius: 999px;
        color: #eadcff;
        background: rgba(168, 85, 247, .09);
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .15em;
        text-transform: uppercase;
        backdrop-filter: blur(12px);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c084fc;
        box-shadow: 0 0 14px #a855f7;
        animation: pulse 1.7s ease-in-out infinite;
      }

      .code {
        margin: 0;
        font-size: clamp(5.8rem, 19vw, 10.5rem);
        font-weight: 900;
        line-height: .76;
        letter-spacing: -.075em;
        color: transparent;
        background: linear-gradient(180deg, #fff 5%, #e9d5ff 45%, #a855f7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 18px 40px rgba(124, 58, 237, .28));
      }

      h1 {
        margin: 28px 0 14px;
        font-size: clamp(1.65rem, 5vw, 2.65rem);
        line-height: 1.08;
        letter-spacing: -.045em;
      }

      .message {
        max-width: 550px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(.95rem, 2.4vw, 1.08rem);
        line-height: 1.7;
      }

      .progress {
        position: relative;
        width: min(360px, 82%);
        height: 3px;
        margin: 34px auto 18px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(216, 180, 254, .13);
      }

      .progress::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--violet-light), var(--violet), transparent);
        animation: working 2.1s ease-in-out infinite;
      }

      .note {
        margin: 0;
        color: #917ba9;
        font-size: .78rem;
        letter-spacing: .04em;
      }

      @keyframes working {
        from { transform: translateX(-115%); }
        to { transform: translateX(275%); }
      }

      @keyframes pulse {
        50% { opacity: .45; transform: scale(.78); }
      }

      @keyframes breathe {
        50% { transform: scale(1.035); opacity: .72; }
      }

      @media (max-width: 540px) {
        .brand { margin-bottom: 38px; }
        .orb { width: 120vw; }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb, .status-dot, .progress::after { animation: none; }
        .progress::after { width: 62%; }
      }
    </style>
  </head>
  <body>
    <div class="orb" aria-hidden="true"></div>
    <main class="maintenance">
      <div class="brand">
        <img src="images/logo.png" alt="" />
        <span>Tactical Web</span>
      </div>
      <div>
        <span class="status"><span class="status-dot"></span>Temporary maintenance</span>
      </div>
      <p class="code" aria-label="Error 503">503</p>
      <h1>We’re building something better.</h1>
      <p class="message">Tactical Web is currently under development. The experience will be back online as soon as it’s ready.</p>
      <div class="progress" aria-hidden="true"></div>
      <p class="note">Service temporarily unavailable</p>
    </main>
  </body>
</html>
