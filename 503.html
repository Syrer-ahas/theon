<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>503 Service Error</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
    body { min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; text-align: center; }
    main { display: grid; gap: 10px; }
    h1 { margin: 0; font-size: clamp(5rem, 18vw, 10rem); line-height: .9; letter-spacing: -.06em; }
    p { margin: 0; font-size: clamp(.8rem, 2vw, 1rem); font-weight: 700; letter-spacing: .28em; }
  </style>
</head>
<body>
  <main>
    <h1>503</h1>
    <p>SERVICE ERROR</p>
  </main>
</body>
</html>
