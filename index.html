    <style>
      .home-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;

        padding: 12px 28px 70px;
      }
      .main-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-width: 0;
        max-width: 900px;
        z-index: 10;
        margin-top: 28px;
      }
      h1.title-top {
        font-family: 'Montserrat', sans-serif;
        font-size: 64px;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 -10px 0;
        line-height: 1;
        letter-spacing: 1.5px;
        text-shadow: 0 8px 30px rgba(124, 58, 237, 0.45);
        z-index: 2;
      }
      .title-box {
        position: relative;
        padding: 6px 0;
        margin-bottom: 36px;

      }
      h2.title-bottom {
        font-family: 'Montserrat', sans-serif;
        font-size: 72px;
        font-weight: 900;
        color: transparent;

        background-clip: text;
        margin: 0;
        line-height: 1.1;
        letter-spacing: 1px;
        text-align: center;
      }
      .chips-carousel-wrapper {
        width: 100%;
        max-width: 800px;
        overflow: hidden;
        position: relative;
        margin-bottom: 24px;
        -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }
      .chips-container {
        display: flex;
        gap: 12px;
        width: max-content;
        animation: scrollChips 30s linear infinite;
      }
      .chips-carousel-wrapper:hover .chips-container { animation-play-state: paused; }
      @keyframes scrollChips {
        0% { transform: translateX(0); }
        100% { transform: translateX(calc(-50% - 6px)); }
      }
      .chip svg { width: 16px; height: 16px; fill: #a98fd6; transition: fill 0.3s ease; }
      .chip:hover svg { fill: #e9d5ff; }
      .input-container {
        background: linear-gradient(145deg, rgba(50, 25, 82, 0.76), rgba(27, 12, 51, 0.64));
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        width: 760px;
        max-width: 100%;
        border-radius: 22px;
        padding: 12px 14px 12px 22px;
        border: 1px solid rgba(192, 132, 252, 0.3);
        box-shadow: 0 20px 50px -14px rgba(0, 0, 0, 0.68), 0 0 40px rgba(124, 58, 237, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 16px;
        transition: all 0.3s ease;
      }
      .input-container:focus-within {
        border-color: rgba(192, 132, 252, 0.5);
        box-shadow: 0 30px 70px -12px rgba(0, 0, 0, 0.75), 0 0 0 4px rgba(168, 85, 247, 0.14), inset 0 1px 0 rgba(255,255,255,0.1);
      }
      .input-field {
        background: transparent;
        border: none;
        color: #f8fafc;
        font-size: 16px;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        margin: 0;
        padding: 12px 0;
        width: 100%;
        min-width: 0;
        outline: none;
        resize: none;
      }
      .input-field::placeholder { color: #8873b3; }
      .input-footer { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex: 0 0 auto; }
      .btn-secondary {
        background: rgba(168, 85, 247, 0.08);
        border: 1px solid rgba(168, 85, 247, 0.2);
        color: #d6c6f2;
        border-radius: 12px;
        padding: 8px 16px;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-secondary:hover { background: rgba(168, 85, 247, 0.18); color: #ffffff; border-color: rgba(192, 132, 252, 0.45); }
      .btn-secondary svg { width: 16px; height: 16px; fill: currentColor; opacity: 0.85; }
      .caret { width: 12px !important; height: 12px !important; margin-left: 2px; opacity: 0.5 !important; }
      .btn-generate {
        background: linear-gradient(135deg, #c084fc, #7c3aed);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        padding: 10px 24px;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 22px rgba(124, 58, 237, 0.45);
      }
      .btn-generate:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(124, 58, 237, 0.6); filter: brightness(1.06); }
      .btn-generate:active { transform: translateY(1px); box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4); }
      @media (max-width: 820px) {
        h1.title-top { font-size: 44px; }
        h2.title-bottom { font-size: 50px; }
        .title-box { padding: 6px 0; }
        .home-content { padding: 24px 16px 60px; }
        .input-container {
          align-items: stretch;
          flex-direction: column;
          gap: 8px;
          padding: 18px;
        }
        .input-footer { flex-wrap: wrap; }
      }
      @media (max-width: 520px) {
        h1.title-top { font-size: 34px; }
        h2.title-bottom {
          max-width: 100%;
          font-size: clamp(30px, 9vw, 36px);
          letter-spacing: 0;
        }
        .input-footer { justify-content: flex-start; }
        .btn-generate { margin-left: auto; }
      }

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const inputField = document.getElementById('mechanicInput');
        document.querySelectorAll('.chip').forEach((chip) => {
          chip.addEventListener('click', () => {
            inputField.value = chip.textContent.trim();
            inputField.focus();
          });
        });

        // Carry the described mechanic into the generator and start there.
        document.getElementById('generateBtn').addEventListener('click', () => {
          const value = (inputField.value || '').trim();
          try {
            if (value) localStorage.setItem('tactical-web-draft-prompt', value);
          } catch (_) {}
          window.location.href = 'generator.html';
        });
        if (inputField) {
          inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              document.getElementById('generateBtn').click();
            }
          });
        }
      });
    </script>
