<html lang="en">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #060814;
        --surface: rgba(12, 17, 31, 0.8);
        --surface-strong: rgba(16, 23, 41, 0.92);
        --border: rgba(255,255,255,0.16);
        --text: #f6f7ff;
        --muted: #93a2c1;
        --accent: #8d7dff;
        --accent-2: #52d5ff;
        --accent-3: #f28dff;
        --success: #4fe7a3;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(141, 125, 255, 0.22), transparent 24%),
          radial-gradient(circle at 80% 0%, rgba(82, 213, 255, 0.20), transparent 20%),
          linear-gradient(135deg, #0d1429 0%, #121c3a 42%, #0b1227 100%);
        overflow-x: hidden;
        user-select: text;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 22%, transparent 76%, rgba(255,255,255,0.05));
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.95), transparent 100%);
      }

      a { color: inherit; text-decoration: none; }
      .container { width: min(1220px, calc(100% - 40px)); margin: 0 auto; }

      .panel {
        background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
        border: 1px solid var(--border);
        border-radius: 24px;
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 60px rgba(0,0,0,0.18);
        position: relative;
        overflow: hidden;
      }

      .panel::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(110deg, rgba(255,255,255,0.35), rgba(255,255,255,0.05), rgba(255,255,255,0.2));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        pointer-events: none;
      }

            .brand { display:flex; align-items:center; gap:12px; font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:0.02em; }
      .brand-logo { width:48px; height:48px; border-radius:0; object-fit:cover; border:0; box-shadow:none; }
      .nav-actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }

      .btn {
        border: 0;
        border-radius: 20px;
        padding: 12px 18px;
        font-family: 'Manrope', sans-serif;
        font-weight: 800;
        cursor: pointer;
        color: white;
        transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
      .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 12px 28px rgba(141,125,255,0.2); }
      .btn-secondary { background: linear-gradient(180deg, rgba(255,240,245,0.98), rgba(250,210,235,0.9)); color:#3a1f2b; box-shadow: 0 8px 22px rgba(6,8,12,0.7), 0 0 18px rgba(140,80,110,0.12); border:1px solid rgba(0,0,0,0.12); }
      .btn-ghost { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color: var(--text); box-shadow:0 6px 18px rgba(6,8,12,0.55); }
      .btn-yellow { background: linear-gradient(180deg, #fff8c8 0%, #ffd96b 70%); color: #4a2a04; border:1px solid rgba(84,54,12,0.16); box-shadow: 0 8px 22px rgba(255,188,40,0.18); }

      .cookie-banner {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: min(920px, calc(100% - 24px));
        z-index: 1400;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(8, 12, 24, 0.92);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 18px 50px rgba(0,0,0,0.28);
        backdrop-filter: blur(16px);
      }
      .cookie-banner.hidden { display: none; }
      .cookie-banner .cookie-actions { display:flex; gap:8px; flex-wrap:wrap; }

      /* Dropdown item variants (use same shape/weight as .btn) */
      .btn-blue { background: linear-gradient(180deg,#e6f3ff 0%, #cfeeff 60%); color:#07293d; border:1px solid rgba(3,46,69,0.08); box-shadow: 0 8px 22px rgba(3,46,69,0.12); }
      .btn-cyan { background: linear-gradient(180deg,#e6fcff 0%, #c8f7ff 60%); color:#003a42; border:1px solid rgba(0,58,66,0.08); box-shadow: 0 8px 22px rgba(0,58,66,0.10); }
      .btn-purple { background: linear-gradient(180deg,#fae8ff 0%, #f2d3ff 60%); color:#3a1f2b; border:1px solid rgba(80,40,80,0.08); box-shadow: 0 8px 22px rgba(80,40,80,0.10); }

        /* Reference-like pill button: soft top highlight, warm fill, subtle inset and drop shadow */
        .btn-primary {
          background: linear-gradient(180deg, #fff7e6 0%, #ffe7b2 60%);
          color: #2e1a07;
          padding: 10px 24px;
          border-radius: 22px;
          border: 1px solid rgba(0,0,0,0.16);
          box-shadow: 0 10px 30px rgba(6,8,12,0.78), 0 0 18px rgba(90,60,20,0.20), inset 0 1px 0 rgba(255,255,255,0.7);
          font-weight: 900;
          letter-spacing: 0.01em;
          outline: 0;
        }
            h1,h2,h3 { font-family:'Manrope',sans-serif; margin:0; }
            .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); font-size:0.9rem; font-weight:700; color:#e8ebff; }

            /* ================= App-style shell: sidebar + main ================= */
            .shell { display:grid; grid-template-columns: 280px 1fr; gap:26px; align-items:start; padding: 24px 0 40px; }

            /* ----- Left rail (sticky) ----- */
            .rail { position:sticky; top:24px; display:grid; gap:18px; }
            .rail .brand { font-size:1.15rem; }
            .rail-card { padding: 22px; border-radius: 22px; background: rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.08); }
            .rail-card h4 { font-family:'Manrope',sans-serif; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); margin:0 0 14px; }
            .rail-nav { display:grid; gap:6px; }
            .rail-nav a { display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:14px; color:#cdd6ee; font-weight:600; font-size:0.95rem; transition: background 0.18s ease, color 0.18s ease; }
            .rail-nav a:hover { background:rgba(255,255,255,0.06); color:#fff; }
            .rail-nav a.active { background:linear-gradient(135deg, rgba(141,125,255,0.22), rgba(82,213,255,0.12)); color:#fff; border:1px solid rgba(141,125,255,0.3); }
            .rail-nav a .ic { font-size:1rem; }
            .rail-cta { display:grid; gap:10px; }
            .rail-cta .btn { width:100%; }

            .rail-stats { display:grid; gap:10px; }
            .rail-stat { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
            .rail-stat strong { font-family:'Manrope',sans-serif; font-size:1.35rem; }
            .rail-stat span { color:var(--muted); font-size:0.82rem; text-align:right; }

            /* ----- Main column ----- */
            .main { display:grid; gap:24px; min-width:0; }

            /* Hero band inside main */
            .hero {
              padding: 42px 36px;
              border-radius: 26px;
              border:1px solid var(--border);
              background:
                radial-gradient(circle at 85% 10%, rgba(82,213,255,0.16), transparent 42%),
                radial-gradient(circle at 10% 90%, rgba(141,125,255,0.20), transparent 46%),
                linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
              position:relative; overflow:hidden;
              display:grid;
              grid-template-columns: 1.05fr 0.95fr;
              gap:28px;
              align-items:start;
            }
            .hero h1 {
              font-size: clamp(2.1rem, 3.6vw, 3.2rem);
              line-height: 1.06; letter-spacing:-0.02em;
              margin: 16px 0 16px; max-width: 20ch;
              background: linear-gradient(180deg,#ffffff 0%, #cfd6ff 100%);
              -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            }
            .hero-lead { color: var(--muted); line-height: 1.75; font-size:1.05rem; max-width: 560px; }
            .hero-actions { display:flex; gap:14px; flex-wrap:wrap; margin: 26px 0 0; }

            .prompt-panel {
              padding: 24px;
              border-radius: 22px;
              background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
              border: 1px solid rgba(255,255,255,0.1);
              display:grid;
              gap:14px;
            }
            .panel-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom: 10px; }
            .panel-header h3 { font-size: 1rem; margin:0; }
            .meta-badge { padding:7px 10px; border-radius:999px; background: rgba(80,212,255,0.12); border:1px solid rgba(80,212,255,0.24); color:#9fe2ff; font-size:0.78rem; font-weight:700; }
            .field { display:grid; gap:6px; }
            .field label { font-size:0.92rem; font-weight:700; }
            .field input, .field textarea, .field select {
              width: 100%;
              border: 1px solid rgba(255,255,255,0.12);
              border-radius: 14px;
              padding: 12px 13px;
              background: rgba(7, 11, 22, 0.8);
              color: var(--text);
              font: inherit;
              resize: vertical;
            }
            .field textarea { min-height: 160px; }
            .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid rgba(82,213,255,0.24); outline-offset: 1px; }
            .prompt-row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
            .stack-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top: 4px; }
            .stack-actions .btn { flex: 1 1 190px; }

            /* Stat strip */
            .trust { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:14px; }
            .stat { padding: 18px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
            .stat strong { display:block; font-size:1.5rem; font-family:'Manrope',sans-serif; }
            .stat span { color: var(--muted); font-size:0.86rem; }

            /* Generic section */
            .section { display:grid; gap:18px; }
            .section-title { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
            .section-title h2 { font-size: 1.5rem; }
            .pill { display:inline-flex; align-items:center; padding:8px 14px; border-radius:999px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); color:#dfe7ff; font-size:0.88rem; }

            /* Feature cards: horizontal rows with icon */
            .feature-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; }
            .feature-card {
              padding: 22px; border-radius: 20px; background: rgba(255,255,255,0.045);
              border:1px solid rgba(255,255,255,0.08); transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
              display:flex; gap:16px; align-items:flex-start;
            }
            .feature-card:hover { transform: translateY(-4px); border-color: rgba(141,125,255,0.32); box-shadow: 0 18px 42px rgba(0,0,0,0.3); }
            .feature-card .ico { flex:0 0 auto; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:1.25rem; background:rgba(141,125,255,0.14); border:1px solid rgba(141,125,255,0.22); }
            .feature-card h3 { font-size:1.02rem; margin-bottom:5px; }
            .feature-card p { color: var(--muted); line-height:1.6; font-size:0.9rem; margin:0; }

            /* Workflow steps: vertical timeline in two columns */
            .steps { display:grid; grid-template-columns: 1fr 1fr; gap:16px; counter-reset: step; }
            .step-card { position:relative; padding: 22px 22px 22px 74px; border-radius: 20px; background: rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.08); transition: transform 0.2s ease, border-color 0.2s ease; }
            .step-card::before {
              counter-increment: step; content: counter(step);
              position:absolute; left:22px; top:22px;
              width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
              font-family:'Manrope',sans-serif; font-weight:800; font-size:1rem;
              color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent-2));
              box-shadow:0 8px 18px rgba(141,125,255,0.28);
            }
            .step-card:hover { transform: translateY(-3px); border-color: rgba(141,125,255,0.28); }
            .step-card strong { display:block; margin: 0 0 6px; font-family:'Manrope',sans-serif; }
            .step-card p { color: var(--muted); line-height:1.6; font-size:0.9rem; margin:0; }

            /* Supported worlds: smaller grid, more per row */
            .world-grid { display:grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap:14px; }
            .world-card { display:flex; align-items:center; justify-content:center; }
            .world-thumb { width: 100%; aspect-ratio: 1 / 1; border-radius: 18px; overflow:hidden; border: 2px solid rgba(255,255,255,0.14); box-shadow: 0 10px 24px rgba(0,0,0,0.24); background: rgba(255,255,255,0.05); transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
            .world-thumb:hover { transform: translateY(-4px); border-color: rgba(141,125,255,0.5); box-shadow: 0 16px 34px rgba(0,0,0,0.34); }
            .world-thumb img { width:100%; height:100%; object-fit:cover; display:block; }

            /* CTA */
            .cta { display:grid; grid-template-columns: 1.4fr auto; gap:24px; align-items:center; padding: 40px 44px; border-radius:26px; }
            .cta h2 { font-size: clamp(1.45rem, 2.4vw, 2rem); line-height:1.14; margin-bottom:10px; }
            .cta p { color: var(--muted); line-height:1.7; margin:0; max-width: 520px; }
            .cta .cta-actions { display:flex; gap:12px; flex-wrap:wrap; }

            .footer { text-align:center; color: var(--muted); padding: 14px 0 30px; font-size: 0.94rem; }

            @media (max-width: 1080px) {
              .shell { grid-template-columns: 1fr; }
              .rail { position:static; }
              .rail .rail-card { display:none; }
              .rail-card.rail-cta-wrap { display:block; }
            }
            @media (max-width: 760px) {
              .feature-grid, .steps, .world-grid { grid-template-columns: 1fr 1fr; }
              .cta { grid-template-columns: 1fr; text-align:left; padding: 32px 28px; }
              .hero { padding: 34px 26px; }
            }
            @media (max-width: 560px) {
              .feature-grid, .steps, .trust { grid-template-columns: 1fr; }
              .world-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
              .container { width: calc(100% - 24px); }
              .hero { padding: 28px 20px; }
              .cta { padding: 26px 20px; }
            }
    </style>

  <body>
    <div class="page-shell">
      <div class="topbar">
        <div class="upgrade-wrap">
          <button class="upgrade-btn" id="upgradeBtn" type="button">
            <span class="spark">✦</span>
            UPGRADE
          </button>
          <div class="upgrade-menu hidden" id="upgradeMenu">
            <button type="button">Generator</button>
            <button type="button">Pro</button>
            <button type="button">Support</button>
          </div>
        </div>
      </div>

      <main class="hero">
        <h1 class="headline">
          <span>DESCRIBE A</span>
          <span class="highlight">GAME MECHANIC</span>
        </h1>

        <div class="tag-row">
          <div class="tag"><span class="emoji">⚙️</span> Build a shop UI</div>
          <div class="tag"><span class="emoji">✨</span> Create climbable platforms</div>
          <div class="tag"><span class="emoji">🎯</span> Add timed rounds</div>
          <div class="tag"><span class="emoji">🧩</span> Add building mechanic</div>
        </div>

        <div class="composer">
          <textarea id="promptInput" placeholder="Add double-jump with particles"></textarea>
          <div class="composer-controls">
            <div class="mini-pill"><span>GPT-5.6 Luna</span></div>
            <div class="mini-pill"><span>1.04</span></div>
            <button class="generate-btn" type="button">Generate</button>
          </div>
        </div>
      </main>
    </div>

    <script>
      const promptInput = document.getElementById('promptInput');
      const upgradeBtn = document.getElementById('upgradeBtn');
      const upgradeMenu = document.getElementById('upgradeMenu');

      promptInput.addEventListener('click', function () {
        window.location.href = 'generator.html';
      });

      upgradeBtn.addEventListener('click', function (event) {
        event.stopPropagation();
        upgradeMenu.classList.toggle('hidden');
      });

      document.addEventListener('click', function (event) {
        if (!event.target.closest('.upgrade-wrap')) {
          upgradeMenu.classList.add('hidden');
        }
      });
    </script>
  </body>
