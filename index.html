    <script src="auth-config.js"></script>
    <script src="auth-session.js"></script>
    <script src="auth-google.js"></script>
    <script src="credit-system.js"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script>
      (() => {
        const video = document.getElementById('homeVideo');
        if (!video) return;
        const reveal = () => video.classList.add('is-ready');
        video.addEventListener('loadeddata', reveal, { once: true });
        video.addEventListener('canplay', reveal, { once: true });
        if (video.readyState >= 2) reveal();
        video.play().catch(() => {});
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) video.pause();
          else video.play().catch(() => {});
        });
      })();

      document.addEventListener('DOMContentLoaded', () => {
        const inputField = document.getElementById('mechanicInput');
        const modelSelect = document.getElementById('modelSelect');
        const modelTrigger = document.getElementById('modelSelectTrigger');
        const modelLabel = document.getElementById('modelTriggerLabel');
        const modelMenu = document.getElementById('modelMenu');
        const modelTabs = Array.from(document.querySelectorAll('[data-model-tab]'));
        const modelPanels = Array.from(document.querySelectorAll('[data-model-panel]'));
        const modelOptions = Array.from(document.querySelectorAll('[data-model]'));
        const generateButton = document.getElementById('generateBtn');
        const creditButton = document.getElementById('homeCreditButton');
        const creditValue = document.getElementById('homeCreditValue');

        const refreshHomeAccess = () => {
          const signedIn = Boolean(window.TacticalAuth.getSession());
          const snapshot = window.TacticalCredits.getSnapshot();
          inputField.disabled = !signedIn;
          modelTrigger.disabled = !signedIn;
          modelOptions.forEach((option) => { option.disabled = !signedIn; });
          document.querySelectorAll('.chip').forEach((chip) => { chip.disabled = !signedIn; });
          generateButton.textContent = signedIn ? 'Chat with AI' : 'Sign in to continue';
          creditValue.textContent = signedIn ? Number(snapshot.credits || 0) + ' credits' : 'Sign in';
          inputField.placeholder = signedIn ? 'Describe the preset you want...' : 'Sign in with Google to start...';
        };

        const closeModelMenu = (returnFocus = false) => {
          modelMenu.hidden = true;
          modelTrigger.setAttribute('aria-expanded', 'false');
          if (returnFocus) modelTrigger.focus();
        };

        const openModelMenu = () => {
          modelMenu.hidden = false;
          modelTrigger.setAttribute('aria-expanded', 'true');
          const activeTab = modelTabs.find((tab) => tab.getAttribute('aria-selected') === 'true');
          if (activeTab) activeTab.focus();
        };

        const activateModelTab = (category) => {
          modelTabs.forEach((tab) => {
            const active = tab.dataset.modelTab === category;
            tab.setAttribute('aria-selected', String(active));
            tab.tabIndex = active ? 0 : -1;
          });
          modelPanels.forEach((panel) => { panel.hidden = panel.dataset.modelPanel !== category; });
        };

        const selectModel = (model) => {
          modelLabel.textContent = model;
          modelOptions.forEach((option) => option.classList.toggle('selected', option.dataset.model === model));
          try { localStorage.setItem('tactical-web-selected-model', model); } catch (_) {}
          closeModelMenu(true);
        };

        modelTrigger.addEventListener('click', () => {
          if (modelMenu.hidden) openModelMenu();
          else closeModelMenu();
        });
        modelTabs.forEach((tab, index) => {
          tab.tabIndex = index === 0 ? 0 : -1;
          tab.addEventListener('click', () => activateModelTab(tab.dataset.modelTab));
          tab.addEventListener('keydown', (event) => {
            if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
            event.preventDefault();
            const direction = event.key === 'ArrowRight' ? 1 : -1;
            const next = modelTabs[(index + direction + modelTabs.length) % modelTabs.length];
            activateModelTab(next.dataset.modelTab);
            next.focus();
          });
        });
        modelOptions.forEach((option) => option.addEventListener('click', () => selectModel(option.dataset.model)));
        document.addEventListener('click', (event) => {
          if (!modelSelect.contains(event.target)) closeModelMenu();
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !modelMenu.hidden) closeModelMenu(true);
        });

        try {
          const savedModel = localStorage.getItem('tactical-web-selected-model');
          const savedOption = modelOptions.find((option) => option.dataset.model === savedModel);
          if (savedOption) {
            modelLabel.textContent = savedModel;
            modelOptions.forEach((option) => option.classList.toggle('selected', option.dataset.model === savedModel));
            const savedPanel = savedOption.closest('[data-model-panel]');
            if (savedPanel) activateModelTab(savedPanel.dataset.modelPanel);
          }
        } catch (_) {}

        document.querySelectorAll('.chip').forEach((chip) => {
          chip.addEventListener('click', () => {
            inputField.value = chip.textContent.trim();
            inputField.focus();
          });
        });

        // Carry the described mechanic into the generator and start there.
        generateButton.addEventListener('click', async () => {
          if (!window.TacticalAuth.getSession()) {
            try { await window.TacticalSignIn.signInWithGoogle(); await window.TacticalCredits.sync({ force: true }); refreshHomeAccess(); }
            catch (_) { refreshHomeAccess(); return; }
          }
          const value = (inputField.value || '').trim();
          try {
            if (value) localStorage.setItem('tactical-web-draft-prompt', value);
            localStorage.setItem('tactical-web-agent-autosend', value ? 'true' : 'false');
          } catch (_) {}
          if (window.TacticalPageLoader && window.TacticalPageLoader.navigate) {
            window.TacticalPageLoader.navigate('/agent');
          } else {
            window.location.href = '/agent';
          }
        });
        if (inputField) {
          inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              document.getElementById('generateBtn').click();
            }
          });
        }
        creditButton.addEventListener('click', async () => {
          if (!window.TacticalAuth.getSession()) {
            try { await window.TacticalSignIn.signInWithGoogle(); await window.TacticalCredits.sync({ force: true }); }
            catch (_) {}
          } else {
            window.location.href = '/account';
          }
          refreshHomeAccess();
        });
        document.addEventListener('tactical-auth-changed', refreshHomeAccess);
        window.addEventListener('tw-credits-changed', refreshHomeAccess);
        refreshHomeAccess();
      });
    </script>
    <script src="tactical-layout.js"></script>
    <script src="auth-ui.js"></script>
    <script src="cookie.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="turnstile-config.js"></script>
