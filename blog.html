<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tactical Web — Blog</title>
  <meta name="description" content="News, updates, and preset stories from Tactical Web." />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tactical-theme.css" />
  <style>
    .blog-head { margin-bottom: 22px; }
    .blog-head h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); margin: 14px 0 12px; line-height: 1.08; }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter { background: rgba(40, 18, 74, 0.5); color: #e2d6f7; border: 1px solid rgba(168, 85, 247, 0.22); border-radius: 99px; padding: 8px 16px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.25s ease; }
    .filter:hover { background: rgba(88, 28, 135, 0.7); }
    .filter.active { background: linear-gradient(135deg, #c084fc, #7c3aed); border-color: transparent; color: #fff; box-shadow: 0 8px 22px rgba(124, 58, 237, 0.4); }
    .post-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 22px; }
    .post-card { overflow: hidden; cursor: pointer; transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease; }
    .post-card:hover { transform: translateY(-4px); border-color: rgba(192, 132, 252, 0.7); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); }
    .post-card img { width: 100%; height: 190px; object-fit: cover; display: block; background: #1c0b38; }
    .post-card .content { padding: 20px; display: grid; gap: 10px; }
    .post-card h3 { font-size: 1.1rem; }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty { padding: 44px; text-align: center; grid-column: 1 / -1; }
    .modal-card h2 { margin-top: 12px; }
    .modal-card img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 16px; margin: 16px 0; background: #1c0b38; }
    .modal-card .close-btn { float: right; }
    .article-content p { color: var(--muted); line-height: 1.85; margin: 0 0 12px; }
    @media (max-width: 980px) { .post-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .post-grid { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="newsletter-popup.css" />
</head>
<body data-page="blog">
  <div class="tw-page">
    <div class="tw-topbar"></div>
    <div class="tw-container">
      <div class="blog-head">
        <span class="eyebrow">Tactical Blog</span>
        <h1>News, releases, and <span class="gradient-text">preset stories.</span></h1>
        <p class="muted">Add or edit articles in the clearly marked <code>posts</code> array inside this HTML file. Visitors can filter the feed and open every post in a focused reader.</p>
        <div class="toolbar">
          <div class="filters" id="filters"></div>
          <span class="muted" id="postCount"></span>
        </div>
      </div>
      <section class="post-grid" id="postGrid"></section>
    </div>
  </div>

  <div class="tw-modal hidden" id="postModal" role="dialog" aria-modal="true" aria-label="Blog post">
    <div class="tw-modal-card">
      <button class="btn btn-ghost close-btn" id="closeModalBtn" type="button">Close</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="auth-config.js"></script>
  <script src="auth-session.js"></script>
  <script src="tactical-layout.js"></script>
  <script src="auth-google.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="auth-ui.js"></script>
  <script>
    // BLOG CONTENT: Add new blogs/news by copying one object in this array.
    const posts = [
      { id: 'welcome-post', title: 'Welcome to Tactical Web', description: 'A short introduction to the Tactical Web preset workflow.', readingTime: '3 min read', category: 'News', image: 'images/logo.png', date: '2026-07-11', author: 'Tactical Web', content: ['Who are We? We are Tactical Web, Owned by Tactical POV, We are a Reshade / Quality Driven Community, Which now Evolved to Making its first AI Generation Tool to help out New People who cannot Make any Presets. Using the AI Tool is the Easiest thing there is, Run an CHAT Agent or Direct Agent, desired for your Choices.', 'For Futher Questions, Ask in Our Server.'] }
    ];

    const postGrid = document.getElementById('postGrid');
    const filters = document.getElementById('filters');
    const postCount = document.getElementById('postCount');
    const modal = document.getElementById('postModal');
    const modalContent = document.getElementById('modalContent');
    let activeCategory = 'All';

    const escapeHtml = (value) => String(value == null ? '' : value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));

    function renderFilters() {
      const categories = ['All', ...new Set(posts.map((post) => post.category).filter(Boolean))];
      filters.innerHTML = '';
      categories.forEach((category) => {
        const button = document.createElement('button');
        button.className = 'filter ' + (category === activeCategory ? 'active' : '');
        button.textContent = category;
        button.onclick = () => { activeCategory = category; renderFilters(); renderPosts(); };
        filters.appendChild(button);
      });
    }

    function renderPosts() {
      const visible = posts.filter((post) => activeCategory === 'All' || post.category === activeCategory);
      postCount.textContent = visible.length + ' ' + (visible.length === 1 ? 'post' : 'posts');
      postGrid.innerHTML = visible.length ? '' : '<div class="panel empty"><h2>No posts in this category yet.</h2><p class="muted">Check back soon for a new dispatch.</p></div>';
      visible.forEach((post) => {
        const card = document.createElement('article');
        card.className = 'panel post-card';
        card.tabIndex = 0;
        card.innerHTML = '<img src="' + escapeHtml(post.image) + '" alt="' + escapeHtml(post.title) + '"><div class="content"><div class="chip-row"><span class="chip">' + escapeHtml(post.category) + '</span><span class="chip">' + escapeHtml(post.readingTime) + '</span></div><h3>' + escapeHtml(post.title) + '</h3><p class="muted">' + escapeHtml(post.description) + '</p><div class="chip-row"><span class="chip">' + escapeHtml(post.date) + '</span><span class="chip">by ' + escapeHtml(post.author) + '</span></div></div>';
        card.onclick = () => openPost(post);
        card.onkeydown = (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openPost(post); } };
        postGrid.appendChild(card);
      });
    }

    function openPost(post) {
      modalContent.innerHTML = '<span class="eyebrow">' + escapeHtml(post.category) + '</span><h2>' + escapeHtml(post.title) + '</h2><div class="chip-row" style="margin:12px 0"><span class="chip">' + escapeHtml(post.readingTime) + '</span><span class="chip">' + escapeHtml(post.date) + '</span><span class="chip">by ' + escapeHtml(post.author) + '</span></div><img src="' + escapeHtml(post.image) + '" alt="' + escapeHtml(post.title) + '"><div class="article-content">' + (post.content || []).map((paragraph) => '<p>' + escapeHtml(paragraph) + '</p>').join('') + '</div>';
      modal.classList.remove('hidden');
      document.getElementById('closeModalBtn').focus();
    }

    function closeModal() { modal.classList.add('hidden'); }
    document.getElementById('closeModalBtn').onclick = closeModal;
    modal.onclick = (event) => { if (event.target === modal) closeModal(); };
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeModal(); });

    renderFilters();
    renderPosts();
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="turnstile-config.js"></script>
  <script src="newsletter-popup.js"></script>
</body>
</html>
